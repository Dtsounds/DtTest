<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Creator Academy 🎬</title>
  <style>
    /* ─── Reset & Base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:    #FF0000;
      --dark:   #0F0F0F;
      --gray:   #282828;
      --mid:    #3D3D3D;
      --light:  #AAAAAA;
      --white:  #FFFFFF;
      --gold:   #FFD700;
      --green:  #00C853;
      --blue:   #2979FF;
      --purple: #AA00FF;
      --orange: #FF6D00;
      --pink:   #F50057;
      --radius: 20px;
      --shadow: 0 8px 32px rgba(0,0,0,0.45);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--dark);
      color: var(--white);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ─── Screen System ─── */
    .screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 24px 20px;
      overflow-y: auto;
      transition: opacity 0.3s, transform 0.3s;
      opacity: 0; pointer-events: none; transform: translateY(30px);
    }
    .screen.active { opacity: 1; pointer-events: all; transform: translateY(0); }

    /* ─── Typography ─── */
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 900; letter-spacing: -1px; }
    h2 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 800; }
    h3 { font-size: clamp(1.1rem, 3vw, 1.4rem); font-weight: 700; }
    p  { font-size: clamp(0.95rem, 2.5vw, 1.2rem); line-height: 1.55; }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 16px 32px; border: none; border-radius: 50px;
      font-size: clamp(1rem, 2.5vw, 1.25rem); font-weight: 800;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: var(--shadow); min-height: 60px;
    }
    .btn:active { transform: scale(0.95); }
    .btn-red    { background: var(--red);    color: #fff; }
    .btn-gold   { background: var(--gold);   color: var(--dark); }
    .btn-green  { background: var(--green);  color: #fff; }
    .btn-blue   { background: var(--blue);   color: #fff; }
    .btn-gray   { background: var(--mid);    color: #fff; }
    .btn-purple { background: var(--purple); color: #fff; }
    .btn-orange { background: var(--orange); color: #fff; }

    /* ─── Cards ─── */
    .card {
      background: var(--gray); border-radius: var(--radius);
      padding: 24px; box-shadow: var(--shadow); width: 100%;
    }
    .card-glow-red    { box-shadow: 0 0 0 3px var(--red),    var(--shadow); }
    .card-glow-gold   { box-shadow: 0 0 0 3px var(--gold),   var(--shadow); }
    .card-glow-green  { box-shadow: 0 0 0 3px var(--green),  var(--shadow); }
    .card-glow-blue   { box-shadow: 0 0 0 3px var(--blue),   var(--shadow); }
    .card-glow-purple { box-shadow: 0 0 0 3px var(--purple), var(--shadow); }
    .card-glow-orange { box-shadow: 0 0 0 3px var(--orange), var(--shadow); }
    .card-glow-pink   { box-shadow: 0 0 0 3px var(--pink),   var(--shadow); }

    /* ─── Spacer ─── */
    .gap { height: 20px; } .gap-sm { height: 12px; } .gap-lg { height: 32px; }

    /* ─────────────────────────────────────────
       HOME SCREEN
    ───────────────────────────────────────── */
    #screen-home { justify-content: center; gap: 0; }
    .home-logo { font-size: 80px; line-height: 1; margin-bottom: 8px; }
    .home-tagline { color: var(--light); text-align: center; margin: 8px 0 32px; }
    .home-brand { color: var(--red); }

    /* Progress bar */
    .progress-bar-wrap { width: 100%; background: var(--mid); border-radius: 50px; height: 12px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); border-radius: 50px; transition: width 0.5s; }
    .progress-label { font-size: 0.85rem; color: var(--light); margin-top: 6px; text-align: right; }

    /* ─────────────────────────────────────────
       LESSON SELECT SCREEN
    ───────────────────────────────────────── */
    #screen-lessons { gap: 16px; }
    .lesson-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .lesson-card {
      background: var(--gray); border-radius: var(--radius);
      padding: 20px 16px; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
      min-height: 120px; position: relative;
    }
    .lesson-card:active { transform: scale(0.97); }
    .lesson-card.locked { opacity: 0.4; cursor: not-allowed; }
    .lesson-card .lesson-icon { font-size: 2.2rem; }
    .lesson-card .lesson-name { font-size: 1rem; font-weight: 800; }
    .lesson-card .lesson-sub  { font-size: 0.78rem; color: var(--light); }
    .lesson-card .lesson-badge {
      position: absolute; top: 12px; right: 12px;
      background: var(--gold); color: var(--dark);
      font-size: 0.7rem; font-weight: 900; padding: 3px 8px; border-radius: 50px;
    }
    .lesson-card .lesson-check { position: absolute; top: 12px; right: 12px; font-size: 1.3rem; }

    /* ─────────────────────────────────────────
       LESSON INTRO SCREEN
    ───────────────────────────────────────── */
    #screen-intro { gap: 20px; }
    .intro-icon { font-size: 5rem; }
    .intro-concept { background: var(--mid); border-radius: 14px; padding: 18px; width: 100%; }
    .intro-concept h3 { margin-bottom: 8px; }
    .intro-bullets { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .intro-bullets li { display: flex; align-items: flex-start; gap: 10px; font-size: 1rem; }
    .intro-bullets li span.bul { font-size: 1.2rem; flex-shrink: 0; }

    /* ─────────────────────────────────────────
       ACTIVITY SCREEN (shared)
    ───────────────────────────────────────── */
    #screen-activity { gap: 16px; }
    .activity-header { text-align: center; }
    .activity-header .task-label {
      background: var(--mid); border-radius: 10px; padding: 8px 16px;
      font-size: 0.9rem; color: var(--light); display: inline-block; margin-bottom: 8px;
    }

    /* ─── Drag & Drop Sequence ─── */
    .sequence-zone {
      width: 100%; display: flex; flex-direction: column; gap: 10px;
    }
    .seq-item {
      background: var(--mid); border-radius: 14px; padding: 16px 20px;
      font-size: 1rem; font-weight: 700; cursor: grab;
      display: flex; align-items: center; gap: 12px;
      transition: opacity 0.2s, background 0.2s;
      touch-action: none;
    }
    .seq-item .drag-handle { color: var(--light); font-size: 1.2rem; }
    .seq-item.dragging { opacity: 0.4; }
    .seq-item.over { background: var(--blue); }

    /* ─── Multiple Choice ─── */
    .mc-options { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .mc-option {
      background: var(--mid); border-radius: 14px; padding: 18px 20px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 14px;
      transition: background 0.2s, transform 0.1s;
      border: 3px solid transparent;
    }
    .mc-option:active { transform: scale(0.98); }
    .mc-option.correct { background: #00C85333; border-color: var(--green); }
    .mc-option.wrong   { background: #FF000033; border-color: var(--red); }
    .mc-option .mc-letter {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--gray); display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1rem; flex-shrink: 0;
    }

    /* ─── Tap Counter / Clicker ─── */
    .clicker-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
    .clicker-display {
      font-size: 5rem; font-weight: 900; color: var(--gold);
      text-shadow: 0 0 30px rgba(255,215,0,0.5);
    }
    .clicker-btn {
      width: 160px; height: 160px; border-radius: 50%;
      background: linear-gradient(135deg, var(--red), var(--orange));
      border: none; font-size: 3.5rem; cursor: pointer;
      box-shadow: 0 8px 32px rgba(255,0,0,0.4);
      transition: transform 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    .clicker-btn:active { transform: scale(0.9); }

    /* ─── Matching / Connect ─── */
    .match-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .match-item {
      background: var(--mid); border-radius: 14px; padding: 14px 12px;
      font-size: 0.92rem; font-weight: 700; cursor: pointer; text-align: center;
      border: 3px solid transparent; transition: border-color 0.2s, background 0.2s;
      min-height: 70px; display: flex; align-items: center; justify-content: center;
    }
    .match-item.selected { border-color: var(--blue); background: #2979FF22; }
    .match-item.matched  { border-color: var(--green); background: #00C85322; opacity: 0.7; cursor: default; }
    .match-item.wrong    { border-color: var(--red); background: #FF000022; }

    /* ─── Tap-to-Fix (Debug) ─── */
    .debug-sequence { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .debug-step {
      background: var(--mid); border-radius: 14px; padding: 16px 18px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 12px;
      border: 3px solid transparent; transition: all 0.2s;
    }
    .debug-step .step-num {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--gray); display: flex; align-items: center;
      justify-content: center; font-size: 0.85rem; font-weight: 900; flex-shrink: 0;
    }
    .debug-step.buggy  { border-color: var(--red); background: #FF000018; }
    .debug-step.fixed  { border-color: var(--green); background: #00C85318; }
    .debug-step.tapped-wrong { animation: shake 0.3s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

    /* ─── Variable slider ─── */
    .var-display {
      font-size: 3rem; font-weight: 900; color: var(--gold); text-align: center;
      text-shadow: 0 0 20px rgba(255,215,0,0.4);
    }
    .var-row { display: flex; gap: 12px; width: 100%; }
    .var-row .btn { flex: 1; }

    /* ─── Internet Path ─── */
    .path-wrap { width: 100%; position: relative; }
    .path-nodes { display: flex; flex-direction: column; gap: 0; width: 100%; align-items: center; }
    .path-node {
      display: flex; align-items: center; gap: 16px;
      width: 100%; padding: 0 10px;
    }
    .path-dot {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--mid); border: 4px solid var(--mid);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; flex-shrink: 0;
      transition: border-color 0.3s, background 0.3s;
      cursor: pointer;
    }
    .path-dot.active-node { border-color: var(--gold); background: #FFD70022; cursor: pointer; animation: pulse 1s infinite alternate; }
    .path-dot.done-node  { border-color: var(--green); background: #00C85322; cursor: default; }
    @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(255,215,0,0.5); } to { box-shadow: 0 0 0 10px rgba(255,215,0,0); } }
    .path-label { font-size: 0.95rem; font-weight: 700; }
    .path-connector { width: 4px; height: 30px; background: var(--mid); margin: 0 auto; border-radius: 2px; transition: background 0.3s; }
    .path-connector.done-conn { background: var(--green); }

    /* ─── Algorithm sort ─── */
    .algo-videos { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .algo-video {
      background: var(--mid); border-radius: 14px; padding: 14px 16px;
      display: flex; align-items: center; gap: 14px; cursor: pointer;
      border: 3px solid transparent; transition: all 0.2s;
    }
    .algo-video .vid-thumb { width: 56px; height: 40px; border-radius: 8px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; flex-shrink:0; }
    .algo-video.selected-algo { border-color: var(--gold); background: #FFD70018; }
    .algo-video.correct-algo  { border-color: var(--green); background: #00C85318; }
    .algo-video.wrong-algo    { border-color: var(--red); background: #FF000018; }

    /* ─────────────────────────────────────────
       WIN / BADGE SCREEN
    ───────────────────────────────────────── */
    #screen-win { justify-content: center; align-items: center; gap: 20px; text-align: center; }
    .win-badge { font-size: 7rem; animation: badgePop 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
    @keyframes badgePop { from { transform: scale(0) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(0deg); opacity: 1; } }
    .win-title { font-size: 2rem; font-weight: 900; color: var(--gold); }
    .win-stars { font-size: 2.5rem; letter-spacing: 8px; }
    .confetti-wrap { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .confetti-piece {
      position: absolute; width: 10px; height: 10px; border-radius: 2px;
      animation: confettiFall linear both;
    }
    @keyframes confettiFall {
      from { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      to   { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ─────────────────────────────────────────
       TOP BAR
    ───────────────────────────────────────── */
    .top-bar {
      display: flex; align-items: center; gap: 12px;
      width: 100%; margin-bottom: 4px; flex-shrink: 0;
    }
    .back-btn {
      background: var(--mid); border: none; color: var(--white);
      width: 44px; height: 44px; border-radius: 50%; font-size: 1.3rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .top-bar-title { font-size: 1rem; font-weight: 800; flex: 1; }
    .xp-chip {
      background: var(--mid); border-radius: 50px; padding: 6px 14px;
      font-size: 0.85rem; font-weight: 800; color: var(--gold); flex-shrink: 0;
    }

    /* ─── Feedback Banner ─── */
    .feedback {
      width: 100%; border-radius: 14px; padding: 16px 20px;
      font-size: 1rem; font-weight: 800; text-align: center;
      display: none; animation: feedIn 0.3s ease;
    }
    @keyframes feedIn { from { transform: translateY(10px); opacity:0; } to { transform: translateY(0); opacity:1; } }
    .feedback.correct { display: block; background: #00C85333; border: 3px solid var(--green); color: var(--green); }
    .feedback.wrong   { display: block; background: #FF000033; border: 3px solid var(--red);   color: var(--red); }
    .feedback.info    { display: block; background: #2979FF22; border: 3px solid var(--blue);   color: #82b1ff; }

    /* ─── Scroll helper ─── */
    .scroll-spacer { height: 40px; flex-shrink: 0; }

    /* ─── Floating XP pop ─── */
    .xp-pop {
      position: fixed; font-size: 1.4rem; font-weight: 900; color: var(--gold);
      pointer-events: none; animation: xpFloat 1.2s ease-out forwards;
      z-index: 999;
    }
    @keyframes xpFloat {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to   { transform: translateY(-80px) scale(1.3); opacity: 0; }
    }

    /* ─── Stars ─── */
    .stars-row { display: flex; gap: 6px; }
    .star { font-size: 1.8rem; transition: transform 0.2s; }
    .star.earned { animation: starPop 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
    @keyframes starPop { from { transform: scale(0); } to { transform: scale(1); } }

  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     CONFETTI LAYER
═══════════════════════════════════════════ -->
<div class="confetti-wrap" id="confetti"></div>

<!-- ═══════════════════════════════════════════
     HOME SCREEN
═══════════════════════════════════════════ -->
<div class="screen active" id="screen-home">
  <div class="home-logo">🎬</div>
  <h1><span class="home-brand">Creator</span> Academy</h1>
  <p class="home-tagline">Learn how YouTube & apps really work — by thinking like a coder!</p>
  <div class="gap"></div>

  <!-- XP & Progress -->
  <div class="card" style="margin-bottom:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-weight:800">Your Progress</span>
      <span id="home-xp" style="color:var(--gold);font-weight:900">⚡ 0 XP</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="home-progress-bar" style="width:0%"></div>
    </div>
    <div class="progress-label" id="home-progress-label">0 / 7 lessons completed</div>
  </div>

  <!-- Badges row -->
  <div id="home-badges" style="font-size:2rem;letter-spacing:6px;min-height:40px;margin-bottom:20px"></div>

  <button class="btn btn-red" style="width:100%;font-size:1.3rem" onclick="showScreen('screen-lessons')">
    🚀 Start Learning!
  </button>
  <div class="gap-sm"></div>
  <button class="btn btn-gray" style="width:100%" onclick="resetProgress()">
    🔄 Reset Progress
  </button>
</div>

<!-- ═══════════════════════════════════════════
     LESSON SELECT SCREEN
═══════════════════════════════════════════ -->
<div class="screen" id="screen-lessons">
  <div class="top-bar">
    <button class="back-btn" onclick="showScreen('screen-home')">←</button>
    <span class="top-bar-title">Choose a Lesson</span>
    <div class="xp-chip" id="lessons-xp">⚡ 0 XP</div>
  </div>
  <div class="lesson-grid" id="lesson-grid"></div>
  <div class="scroll-spacer"></div>
</div>

<!-- ═══════════════════════════════════════════
     INTRO SCREEN
═══════════════════════════════════════════ -->
<div class="screen" id="screen-intro">
  <div class="top-bar">
    <button class="back-btn" onclick="showScreen('screen-lessons')">←</button>
    <span class="top-bar-title" id="intro-top-title">Lesson</span>
    <div class="xp-chip" id="intro-xp">⚡ 0 XP</div>
  </div>
  <div class="intro-icon" id="intro-icon"></div>
  <h2 id="intro-title" style="text-align:center"></h2>
  <p id="intro-subtitle" style="text-align:center;color:var(--light)"></p>
  <div class="intro-concept card" id="intro-concept-card">
    <h3 id="intro-concept-title"></h3>
    <ul class="intro-bullets" id="intro-bullets"></ul>
  </div>
  <div id="intro-extra" style="width:100%"></div>
  <button class="btn btn-red" style="width:100%;margin-top:8px" id="intro-start-btn" onclick="startActivity()">
    🎮 Let's Play!
  </button>
  <div class="scroll-spacer"></div>
</div>

<!-- ═══════════════════════════════════════════
     ACTIVITY SCREEN
═══════════════════════════════════════════ -->
<div class="screen" id="screen-activity">
  <div class="top-bar">
    <button class="back-btn" onclick="showScreen('screen-intro')">←</button>
    <span class="top-bar-title" id="activity-top-title"></span>
    <div class="xp-chip" id="activity-xp">⚡ 0 XP</div>
  </div>

  <div class="activity-header" style="width:100%">
    <div class="task-label" id="activity-round-label">Round 1 of 3</div>
    <h3 id="activity-question" style="margin-top:6px;text-align:center"></h3>
  </div>

  <div id="activity-body" style="width:100%"></div>
  <div class="feedback" id="activity-feedback"></div>

  <!-- Stars row -->
  <div class="stars-row" id="stars-row">
    <div class="star" id="star-1">☆</div>
    <div class="star" id="star-2">☆</div>
    <div class="star" id="star-3">☆</div>
  </div>

  <button class="btn btn-green" style="width:100%;display:none" id="next-btn" onclick="nextRound()">
    ➡️ Next
  </button>
  <div class="scroll-spacer"></div>
</div>

<!-- ═══════════════════════════════════════════
     WIN SCREEN
═══════════════════════════════════════════ -->
<div class="screen" id="screen-win">
  <div class="win-badge" id="win-badge">🏆</div>
  <div class="win-title" id="win-title">Amazing!</div>
  <div class="win-stars" id="win-stars">⭐⭐⭐</div>
  <p id="win-message" style="color:var(--light);max-width:340px;text-align:center"></p>
  <p style="color:var(--gold);font-weight:900;font-size:1.3rem" id="win-xp-gained"></p>
  <button class="btn btn-gold" style="width:100%;max-width:400px" onclick="showScreen('screen-lessons')">
    🗂️ More Lessons
  </button>
  <button class="btn btn-gray" style="width:100%;max-width:400px" onclick="replayLesson()">
    🔁 Play Again
  </button>
</div>

<script>
/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let state = {
  xp: 0,
  completed: {}, // lessonId: stars earned
  currentLesson: null,
  currentRound: 0,
  roundResults: [],
};

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('ca_state'));
    if (s) state = s;
  } catch(e) {}
}
function saveState() {
  localStorage.setItem('ca_state', JSON.stringify(state));
}
function resetProgress() {
  if (confirm('Reset all progress? 🗑️')) {
    localStorage.removeItem('ca_state');
    state = { xp:0, completed:{}, currentLesson:null, currentRound:0, roundResults:[] };
    updateXPDisplay();
    renderLessonGrid();
    renderHomeBadges();
  }
}

/* ═══════════════════════════════════════════
   LESSONS DEFINITION
═══════════════════════════════════════════ */
const LESSONS = [
  {
    id: 'algorithm',
    name: 'Algorithms',
    icon: '🤖',
    sub: 'How YouTube decides what to show you',
    color: 'red',
    colorVar: 'var(--red)',
    badge: '🤖',
    introBullets: [
      { icon: '📋', text: 'An algorithm is just a list of steps a computer follows.' },
      { icon: '📺', text: 'YouTube uses one to pick which video to show you next.' },
      { icon: '❤️', text: 'It looks at what you liked, watched, and searched for.' },

/* ═══════════════════════════════════════════
   SCREEN NAVIGATION
═══════════════════════════════════════════ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  updateXPDisplay();
}

function updateXPDisplay() {
  const xp = state.xp;
  const done = Object.keys(state.completed).length;
  document.getElementById('home-xp').textContent = `⚡ ${xp} XP`;
  document.getElementById('home-progress-bar').style.width = `${(done/7)*100}%`;
  document.getElementById('home-progress-label').textContent = `${done} / 7 lessons completed`;
  ['lessons-xp','intro-xp','activity-xp'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = `⚡ ${xp} XP`;
  });
}

/* ═══════════════════════════════════════════
   LESSON GRID
═══════════════════════════════════════════ */
function renderLessonGrid() {
  const grid = document.getElementById('lesson-grid');
  grid.innerHTML = '';
  LESSONS.forEach((lesson, idx) => {
    const locked = false; // all unlocked for kids
    const done = state.completed[lesson.id];
    const card = document.createElement('div');
    card.className = 'lesson-card' + (locked ? ' locked' : '');
    card.style.boxShadow = `0 0 0 3px ${lesson.colorVar}, var(--shadow)`;
    card.innerHTML = `
      <div class="lesson-icon">${lesson.icon}</div>
      <div class="lesson-name">${lesson.name}</div>
      <div class="lesson-sub">${lesson.sub}</div>
      ${done ? `<div class="lesson-check">⭐</div>` : ''}
    `;
    if (!locked) card.onclick = () => openLesson(lesson.id);
    grid.appendChild(card);
  });
}

/* ═══════════════════════════════════════════
   OPEN LESSON (INTRO)
═══════════════════════════════════════════ */
function openLesson(lessonId) {
  const lesson = LESSONS.find(l => l.id === lessonId);
  state.currentLesson = lessonId;
  saveState();

  document.getElementById('intro-top-title').textContent = lesson.name;
  document.getElementById('intro-icon').textContent = lesson.icon;
  document.getElementById('intro-title').textContent = lesson.introTitle;
  document.getElementById('intro-subtitle').textContent = lesson.introSubtitle;
  document.getElementById('intro-concept-title').textContent = lesson.conceptTitle;
  document.getElementById('intro-concept-card').className = `intro-concept card card-glow-${lesson.color}`;

  const bullets = document.getElementById('intro-bullets');
  bullets.innerHTML = '';
  lesson.introBullets.forEach(b => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="bul">${b.icon}</span><span>${b.text}</span>`;
    bullets.appendChild(li);
  });

  // Show badge if already earned
  const extra = document.getElementById('intro-extra');
  if (state.completed[lessonId]) {
    extra.innerHTML = `<div style="text-align:center;color:var(--gold);font-weight:900;font-size:1.1rem;margin:8px 0">You already earned: ${lesson.badge} — try again for more stars!</div>`;
  } else {
    extra.innerHTML = '';
  }

  showScreen('screen-intro');
}

/* ═══════════════════════════════════════════
   ROUND RENDERING
═══════════════════════════════════════════ */
function renderRound() {
  const lessonId = state.currentLesson;
  const activity = ACTIVITIES[lessonId];
  const round = activity.rounds[state.currentRound];
  const total = activity.rounds.length;

  document.getElementById('activity-round-label').textContent = `Round ${state.currentRound+1} of ${total}`;
  document.getElementById('activity-question').textContent = round.question;
  document.getElementById('activity-feedback').className = 'feedback';
  document.getElementById('next-btn').style.display = 'none';

  const body = document.getElementById('activity-body');
  body.innerHTML = '';

  if (round.type === 'mc') renderMC(round, body);
  else if (round.type === 'sequence') renderSequence(round, body);
  else if (round.type === 'clicker') renderClicker(round, body);
  else if (round.type === 'matching') renderMatching(round, body);
  else if (round.type === 'counter') renderCounter(round, body);
  else if (round.type === 'debug') renderDebug(round, body);
  else if (round.type === 'path') renderPath(round, body);
}

/* ─── Multiple Choice ─── */
function renderMC(round, body) {
  const wrap = document.createElement('div');
  wrap.className = 'mc-options';
  const letters = ['A','B','C','D'];
  round.options.forEach((opt, i) => {
    const el = document.createElement('div');
    el.className = 'mc-option';
    el.innerHTML = `<div class="mc-letter">${letters[i]}</div><span>${opt.text}</span>`;
    el.onclick = () => {
      if (wrap.dataset.answered) return;
      wrap.dataset.answered = '1';
      if (opt.correct) {
        el.classList.add('correct');
        showFeedback('correct', '✅ ' + round.explain);
        recordResult(true);
      } else {
        el.classList.add('wrong');
        // show correct
        wrap.querySelectorAll('.mc-option').forEach((o,j) => { if(round.options[j].correct) o.classList.add('correct'); });
        showFeedback('wrong', '❌ ' + round.wrongExplain);
        recordResult(false);
      }
    };
    wrap.appendChild(el);
  });
  body.appendChild(wrap);
}

/* ─── Sequence Drag ─── */
let dragSrc = null;
function renderSequence(round, body) {
  // Shuffle items
  const shuffled = [...round.items].sort(() => Math.random() - 0.5);
  const zone = document.createElement('div');
  zone.className = 'sequence-zone';
  zone.id = 'seq-zone';

  shuffled.forEach(item => {
    const el = document.createElement('div');
    el.className = 'seq-item';
    el.dataset.id = item.id;
    el.draggable = true;
    el.innerHTML = `<span class="drag-handle">⠿</span><span>${item.icon}</span><span>${item.text}</span>`;
    addDragListeners(el, zone, round);
    addTouchDrag(el, zone, round);
    zone.appendChild(el);
  });

  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn btn-blue';
  checkBtn.style.width = '100%';
  checkBtn.style.marginTop = '8px';
  checkBtn.textContent = '✅ Check My Order!';
  checkBtn.onclick = () => checkSequence(round, zone, checkBtn);

  body.appendChild(zone);
  body.appendChild(checkBtn);
}

function addDragListeners(el, zone, round) {
  el.addEventListener('dragstart', e => {
    dragSrc = el;
    setTimeout(() => el.classList.add('dragging'), 0);
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => {
    e.preventDefault();
    el.classList.remove('over');
    if (dragSrc && dragSrc !== el) {
      const items = [...zone.querySelectorAll('.seq-item')];
      const srcIdx = items.indexOf(dragSrc);
      const dstIdx = items.indexOf(el);
      if (srcIdx < dstIdx) zone.insertBefore(dragSrc, el.nextSibling);
      else zone.insertBefore(dragSrc, el);
    }
  });
}

// Touch drag for iPad
function addTouchDrag(el, zone, round) {
  let touchClone = null, startY = 0, startX = 0;
  el.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    dragSrc = el;
    touchClone = el.cloneNode(true);
    touchClone.style.cssText = `position:fixed;opacity:0.75;pointer-events:none;z-index:999;width:${el.offsetWidth}px;border-radius:14px;background:#4d4d4d;padding:16px 20px;font-size:1rem;font-weight:700;display:flex;align-items:center;gap:12px;`;
    document.body.appendChild(touchClone);
    moveTouchClone(e.touches[0]);
  }, {passive:true});

  el.addEventListener('touchmove', e => {
    e.preventDefault();
    moveTouchClone(e.touches[0]);
    const items = [...zone.querySelectorAll('.seq-item')];
    items.forEach(i => i.classList.remove('over'));
    const target = getTouchTarget(e.touches[0], items);
    if (target) target.classList.add('over');
  }, {passive:false});

  el.addEventListener('touchend', e => {
    if (touchClone) { document.body.removeChild(touchClone); touchClone = null; }
    const items = [...zone.querySelectorAll('.seq-item')];
    items.forEach(i => i.classList.remove('over'));
    const target = getTouchTarget(e.changedTouches[0], items);
    if (target && target !== dragSrc) {
      const srcIdx = items.indexOf(dragSrc);
      const dstIdx = items.indexOf(target);
      if (srcIdx < dstIdx) zone.insertBefore(dragSrc, target.nextSibling);
      else zone.insertBefore(dragSrc, target);
    }
    dragSrc = null;
  }, {passive:true});

  function moveTouchClone(touch) {
    if (!touchClone) return;
    touchClone.style.left = (touch.clientX - 20) + 'px';
    touchClone.style.top  = (touch.clientY - 30) + 'px';
  }
  function getTouchTarget(touch, items) {
    return items.find(item => {
      const r = item.getBoundingClientRect();
      return touch.clientX >= r.left && touch.clientX <= r.right && touch.clientY >= r.top && touch.clientY <= r.bottom;
    });
  }
}

function checkSequence(round, zone, btn) {
  const order = [...zone.querySelectorAll('.seq-item')].map(el => el.dataset.id);
  const correct = JSON.stringify(order) === JSON.stringify(round.correctOrder);
  btn.disabled = true;
  if (correct) {
    showFeedback('correct', '✅ ' + round.explain);
    recordResult(true);
  } else {
    showFeedback('wrong', '❌ Not quite — try dragging them around and check again! The correct order is shown below.');
    // Show correct order hint
    const correct_items = round.correctOrder.map(id => round.items.find(i => i.id === id));
    const hint = document.createElement('div');
    hint.style.cssText = 'margin-top:8px;font-size:0.85rem;color:var(--light)';
    hint.textContent = 'Correct: ' + correct_items.map(i => i.icon).join(' → ');
    zone.parentNode.insertBefore(hint, btn);
    recordResult(false);
  }
}

/* ─── Clicker ─── */
function renderClicker(round, body) {
  let count = 0;
  const wrap = document.createElement('div');
  wrap.className = 'clicker-wrap';
  const display = document.createElement('div');
  display.className = 'clicker-display';
  display.textContent = count;
  const prog = document.createElement('div');
  prog.textContent = `Goal: ${round.targetCount} taps`;
  prog.style.cssText = 'color:var(--light);font-size:0.95rem;';
  const btn = document.createElement('button');
  btn.className = 'clicker-btn';
  btn.innerHTML = '▶️';
  btn.onclick = () => {
    if (count >= round.targetCount) return;
    count++;
    display.textContent = count;
    if (count >= round.targetCount) {
      display.style.color = 'var(--green)';
      showFeedback('correct', '✅ ' + round.explain);
      recordResult(true);
    }
  };
  wrap.appendChild(display);
  wrap.appendChild(prog);
  wrap.appendChild(btn);
  body.appendChild(wrap);
}

/* ─── Matching ─── */
function renderMatching(round, body) {
  // Separate left/right, shuffle right column
  const lefts = round.pairs.map(p => p.left);
  const rights = [...round.pairs.map(p => p.right)].sort(() => Math.random()-0.5);
  const grid = document.createElement('div');
  grid.className = 'match-grid';

  let selectedLeft = null, matchedPairs = 0;

  lefts.forEach((left, li) => {
    const el = document.createElement('div');
    el.className = 'match-item';
    el.dataset.side = 'left';
    el.dataset.idx = li;
    el.textContent = left;
    el.onclick = () => {
      if (el.classList.contains('matched')) return;
      document.querySelectorAll('.match-item[data-side=left]').forEach(e => e.classList.remove('selected'));
      selectedLeft = li;
      el.classList.add('selected');
    };
    grid.appendChild(el);

    const rightText = rights[li];
    const rightOrigIdx = round.pairs.findIndex(p => p.right === rightText);
    const rel = document.createElement('div');
    rel.className = 'match-item';
    rel.dataset.side = 'right';
    rel.dataset.original = rightOrigIdx;
    rel.textContent = rightText;
    rel.onclick = () => {
      if (rel.classList.contains('matched')) return;
      if (selectedLeft === null) { showFeedback('info','💡 Tap a left side first, then tap a right side to match!'); return; }
      const leftEl = grid.querySelector(`.match-item[data-side=left][data-idx="${selectedLeft}"]`);
      if (selectedLeft === parseInt(rel.dataset.original)) {
        leftEl.classList.add('matched'); leftEl.classList.remove('selected');
        rel.classList.add('matched');
        matchedPairs++;
        selectedLeft = null;
        showFeedback('info', `✅ Match! ${matchedPairs} of ${round.pairs.length} done.`);
        if (matchedPairs === round.pairs.length) {
          setTimeout(() => { showFeedback('correct', '🎉 ' + round.explain); recordResult(true); }, 400);
        }
      } else {
        rel.classList.add('wrong');
        leftEl.classList.add('wrong');
        setTimeout(() => { rel.classList.remove('wrong','selected'); leftEl.classList.remove('wrong','selected'); selectedLeft = null; }, 700);
        showFeedback('wrong', '❌ Not quite — try a different match!');
      }
    };
    grid.appendChild(rel);
  });

  body.appendChild(grid);
}

/* ─── Counter Variable ─── */
function renderCounter(round, body) {
  let val = round.startVal;
  const wrap = document.createElement('div');
  wrap.className = 'clicker-wrap';
  const label = document.createElement('div');
  label.style.cssText = 'font-size:0.9rem;color:var(--light);text-align:center;';
  label.textContent = 'likes = ';
  const display = document.createElement('div');
  display.className = 'var-display';
  display.textContent = val.toLocaleString();
  const row = document.createElement('div');
  row.className = 'var-row';
  const addBtn = document.createElement('button');
  addBtn.className = 'btn btn-green';
  addBtn.innerHTML = '👍 +1 Like';
  addBtn.onclick = () => { val++; display.textContent = val.toLocaleString(); };
  const subBtn = document.createElement('button');
  subBtn.className = 'btn btn-gray';
  subBtn.innerHTML = '👎 -1 Like';
  subBtn.onclick = () => { val = Math.max(0,val-1); display.textContent = val.toLocaleString(); };
  const doneBtn = document.createElement('button');
  doneBtn.className = 'btn btn-blue';
  doneBtn.style.width = '100%';
  doneBtn.textContent = '✅ I get it!';
  doneBtn.onclick = () => { showFeedback('correct', '✅ ' + round.explain); recordResult(true); };
  row.appendChild(addBtn);
  row.appendChild(subBtn);
  wrap.appendChild(label);
  wrap.appendChild(display);
  wrap.appendChild(row);
  body.appendChild(wrap);
  body.appendChild(document.createElement('div')).className = 'gap';
  body.appendChild(doneBtn);
}

/* ─── Debug ─── */
function renderDebug(round, body) {
  const zone = document.createElement('div');
  zone.className = 'debug-sequence';
  round.steps.forEach(step => {
    const el = document.createElement('div');
    el.className = 'debug-step';
    el.dataset.id = step.id;
    el.innerHTML = `<div class="step-num">${round.steps.indexOf(step)+1}</div><span>${step.text}</span>`;
    el.onclick = () => {
      if (zone.dataset.done) return;
      if (step.correct) {
        el.classList.add('buggy');
        zone.dataset.done = '1';
        showFeedback('correct', '🐛 Bug found! ' + (step.reason ? step.reason + ' ' : '') + round.explain);
        recordResult(true);
      } else {
        el.classList.add('tapped-wrong');
        setTimeout(() => el.classList.remove('tapped-wrong'), 300);
        showFeedback('wrong', '🔍 That step looks fine. Keep looking!');
      }
    };
    zone.appendChild(el);
  });
  body.appendChild(zone);
}

/* ─── Internet Path ─── */
function renderPath(round, body) {
  let current = 0;
  const wrap = document.createElement('div');
  wrap.className = 'path-wrap';
  const nodesEl = document.createElement('div');
  nodesEl.className = 'path-nodes';

  round.nodes.forEach((node, i) => {
    const row = document.createElement('div');
    row.className = 'path-node';

    const dot = document.createElement('div');
    dot.className = 'path-dot' + (i === 0 ? ' active-node' : '');
    dot.id = `path-dot-${i}`;
    dot.textContent = node.icon;
    dot.onclick = () => {
      if (i !== current) return;
      dot.classList.remove('active-node');
      dot.classList.add('done-node');
      if (i < round.nodes.length-1) {
        const conn = document.getElementById(`path-conn-${i}`);
        if (conn) conn.classList.add('done-conn');
        document.getElementById(`path-dot-${i+1}`).classList.add('active-node');
        showFeedback('info', `📡 ${node.detail}`);
      }
      current++;
      if (current >= round.nodes.length) {
        setTimeout(() => { showFeedback('correct', '🌍 ' + round.explain); recordResult(true); }, 400);
      }
    };

    const info = document.createElement('div');
    info.className = 'path-label';
    info.innerHTML = `<div style="font-weight:900">${node.label}</div><div style="font-size:0.8rem;color:var(--light)">${node.detail}</div>`;

    row.appendChild(dot);
    row.appendChild(info);
    nodesEl.appendChild(row);

    if (i < round.nodes.length-1) {
      const conn = document.createElement('div');
      conn.className = 'path-connector';
      conn.id = `path-conn-${i}`;
      nodesEl.appendChild(conn);
    }
  });

  wrap.appendChild(nodesEl);
  body.appendChild(wrap);
}

/* ═══════════════════════════════════════════
   RESULTS & WIN
═══════════════════════════════════════════ */
function recordResult(correct) {
  state.roundResults.push(correct);
  const total = ACTIVITIES[state.currentLesson].rounds.length;
  const roundIdx = state.currentRound;

  if (correct) {
    const starEl = document.getElementById(`star-${roundIdx+1}`);
    starEl.textContent = '⭐';
    starEl.classList.add('earned');
    spawnXP();
    state.xp += 25;
    saveState();
    updateXPDisplay();
  }

  document.getElementById('next-btn').style.display = 'flex';
  if (state.currentRound === total-1) {
    document.getElementById('next-btn').textContent = '🏆 Finish!';
  }
}

function nextRound() {
  const total = ACTIVITIES[state.currentLesson].rounds.length;
  state.currentRound++;
  if (state.currentRound >= total) {
    finishLesson();
  } else {
    renderRound();
  }
}

function finishLesson() {
  const results = state.roundResults;
  const stars = results.filter(Boolean).length;
  const lesson = LESSONS.find(l => l.id === state.currentLesson);

  // Save best score
  const prev = state.completed[state.currentLesson] || 0;
  state.completed[state.currentLesson] = Math.max(prev, stars);
  saveState();

  // Win screen
  const badge = lesson.badge;
  const starsStr = '⭐'.repeat(stars) + '☆'.repeat(results.length - stars);
  const msgs = [
    'Nice try! Replay to improve your stars!',
    'Good effort! Can you get more stars?',
    'Great job! You\'re getting it!',
    '🔥 Perfect! You crushed it!',
  ];

  document.getElementById('win-badge').textContent = badge;
  document.getElementById('win-title').textContent = stars === results.length ? 'PERFECT! 🔥' : stars > 1 ? 'Great Work! 🎉' : 'Nice Try! 💪';
  document.getElementById('win-stars').textContent = starsStr;
  document.getElementById('win-message').textContent = msgs[stars] || msgs[0];
  document.getElementById('win-xp-gained').textContent = `+${stars*25} XP earned this round!`;

  renderLessonGrid();
  renderHomeBadges();
  spawnConfetti();
  showScreen('screen-win');
}

function renderHomeBadges() {
  const el = document.getElementById('home-badges');
  el.textContent = Object.keys(state.completed)
    .map(id => LESSONS.find(l => l.id === id)?.badge || '')
    .join(' ');
}

/* ═══════════════════════════════════════════
   FEEDBACK
═══════════════════════════════════════════ */
function showFeedback(type, msg) {
  const fb = document.getElementById('activity-feedback');
  fb.className = `feedback ${type}`;
  fb.textContent = msg;
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ═══════════════════════════════════════════
   EFFECTS
═══════════════════════════════════════════ */
function spawnXP() {
  const el = document.createElement('div');
  el.className = 'xp-pop';
  el.textContent = '+25 XP ⚡';
  el.style.left = (Math.random()*60+20)+'%';
  el.style.top = '40%';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

function spawnConfetti() {
  const wrap = document.getElementById('confetti');
  wrap.innerHTML = '';
  const colors = ['#FF0000','#FFD700','#00C853','#2979FF','#AA00FF','#FF6D00','#F50057'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100+'vw';
    p.style.top = '-10px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (Math.random()*2+1.5)+'s';
    p.style.animationDelay = (Math.random()*1.5)+'s';
    p.style.width = (Math.random()*10+6)+'px';
    p.style.height = (Math.random()*10+6)+'px';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    wrap.appendChild(p);
  }
  setTimeout(() => { wrap.innerHTML = ''; }, 4000);
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
loadState();
renderLessonGrid();
renderHomeBadges();
updateXPDisplay();
</script>
